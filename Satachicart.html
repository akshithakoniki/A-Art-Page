<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <Style>
        body {
            background-color: rgb(252, 251, 249);
        }

        .label {
            background-color: black;
            color: white;
            height: 35px;
            width: auto;
            font-size: 20px;
            text-align: center;
        }

        .label p {
            display: inline;
            text-align: center;
        }

        .label a {
            color: white;
            text-decoration: underline;
            font-size: 20px;
        }

        .nav-bar {
            background-color: white;
            margin-top: 30px;
        }

        h1 {
            display: inline;
            margin-left: 20px;
            margin-right: 350px;
            font-size: 30px;
        }

        .icons {
            display: inline;
            margin-left: 40px;
        }

        .icons i {
            padding: 20px;
            font-size: 38px;
        }

        .contents a {
            text-decoration: none;
            color: black;
            font-size: 25px;
            padding: 10px;
        }

        .contents {
            margin-top: 10px;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        input {
            padding: 5px;
            font-size: 20px;
            border: 1px black solid;
            text-align: center;
        }

        .cart-data {
            width: 600px;
            background-color: rgba(236, 234, 230, 0.92);
        }
    </style>
</head>

<body>
    <div class="label">
        <p>Make Your Everyday More Beautiful</p>
        <a href="#">Get 10% OFF on Original Art</a>
    </div>
    <div class="nav-bar">
        <div class="heading">
            <H1>🐾 SAATACHI ART</H1>
            <input type="text" placeholder="Search for return policy">
            <div class="icons float-end">
                <i class="bi bi-person-circle"></i>
                <i class="bi bi-dash-circle-dotted"></i>
                <i class="bi bi-bag-check"></i>
            </div>
        </div>
        <div class="contents">
            <a href="#">Paintings</a>
            <a href="">Photography</a>
            <a href="">Sculpture</a>
            <a href="">Drawings</a>
            <a href="">Prints</a>
            <a href="">Inspiration</a>
            <a href="">Art</a>
            <a href="">Trade</a>
            <a href="">Deals</a>
        </div>
    </div>
    <div class="cart-data mt-5 bg-grey ms-5">
        <h4 class="pt-3 m-5">Cart</h4>

    </div>
    <script src="satachi.js"></script>
</body>

</html>
